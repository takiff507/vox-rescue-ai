[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-rescue-ai"
version = "0.1.0"
description = "Storage-safe real-time speech enhancement research scaffold"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vox-build-manifest = "vox_rescue.manifest:main"
vox-self-check = "vox_rescue.self_check:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

